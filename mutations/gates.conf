# Mutation spec for local_dictionaries — run with `mdl mutate moodle-local_dictionaries mutations/gates.conf`.
#
# Each gate breaks ONE guard and names the test(s) that must go red because of it. A gate with no
# `->` line is one the author expects NO test to hold: its result is the finding, not a pass.
# Sweep BOTH database families (--db pgsql and --db mariadb): the key fold and the exact-key check
# exist because MariaDB's collation folds more than PostgreSQL's.
#
#     tag | file relative to the repo | perl script relative to this file

# --- Key folding (classes/local/keys.php) ------------------------------------------------
K1_code_key_keeps_accents | classes/local/keys.php | k1_no_accent_fold.pl
#   -> manager_test::test_code_key_folds_case_and_accents
#   -> resolver_test::test_accent_variant_is_the_same_code

K2_code_key_keeps_case | classes/local/keys.php | k2_no_case_fold.pl
#   -> manager_test::test_code_key_folds_case_and_accents
#   -> resolver_test::test_resolve_bulk_is_case_insensitive_and_keyed_by_caller_spelling

K3_code_key_skips_decomposition | classes/local/keys.php | k3_no_decomposition.pl
#   -> manager_test::test_code_key_folds_case_and_accents
#   -> resolver_test::test_accent_variant_is_the_same_code

# --- Resolver (classes/resolver.php) -----------------------------------------------------
R1_result_keyed_by_code_key | classes/resolver.php | r1_result_keyed_by_code_key.pl
#   -> resolver_test::test_resolve_bulk_is_case_insensitive_and_keyed_by_caller_spelling
#   -> resolver_test::test_accent_variant_is_the_same_code

# The exact-key check only matters when the collation returns a row for a key nobody asked for
# (MariaDB, 'ß' = 'ss'); the test stores 'ss' and resolves 'ß'. PostgreSQL never returns that row, so
# the gate can only redden on the MariaDB sweep.
R2_no_exact_key_check | classes/resolver.php | r2_no_exact_key_check.pl
#   -> resolver_test::test_resolve_bulk_ignores_rows_the_collation_folds_onto_another_key

R3_revision_not_in_cache_key | classes/resolver.php | r3_revision_not_in_cache_key.pl
#   -> resolver_test::test_resolve_sees_a_label_written_after_it_was_cached

R4_no_revision_bump | classes/local/manager.php | r4_no_revision_bump.pl
#   -> manager_test::test_upsert_items_writes_search_key_and_bumps_revision
#   -> resolver_test::test_resolve_sees_a_label_written_after_it_was_cached

