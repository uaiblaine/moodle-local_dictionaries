# Mutation spec for the plugins directory readiness gates (tests/marketplace_readiness_test.php).
# Kept apart from gates.conf so the sweep of these gates does not rerun the plugin's other guards.
# Run from the main session (fleet rule 6), on both database families:
#   mdl mutate moodle-local_dictionaries moodle-local_dictionaries/mutations/marketplace.conf --fast --db pgsql
#   mdl mutate moodle-local_dictionaries moodle-local_dictionaries/mutations/marketplace.conf --fast --db mariadb
#
# Each gate breaks ONE rule and names the test that must go red.
#
#     tag | file relative to the repo | perl script relative to this file

# --- What the release package carries (.gitattributes) ----------------------------------
MK1_licence_left_out | .gitattributes | mk1_licence_left_out.pl
#   -> marketplace_readiness_test::test_the_package_carries_a_licence_file

MK2_pt_br_shipped | .gitattributes | mk2_pt_br_shipped.pl
#   -> marketplace_readiness_test::test_only_english_strings_ship

# --- The README names every table and capability -----------------------------------------
MK3_readme_table_unnamed | README.md | mk3_readme_table_unnamed.pl
#   -> marketplace_readiness_test::test_the_readme_names_tables_capabilities_and_dependencies

MK4_readme_capability_unnamed | README.md | mk4_readme_capability_unnamed.pl
#   -> marketplace_readiness_test::test_the_readme_names_tables_capabilities_and_dependencies

# --- Settings storage: the adapted check still catches a stored setting -------------------
MK5_setting_in_main_config | settings.php | mk5_setting_in_main_config.pl
#   -> marketplace_readiness_test::test_settings_are_stored_per_plugin

# --- Lang files are data only --------------------------------------------------------------
MK6_lang_concatenation | lang/en/local_dictionaries.php | mk6_lang_concatenation.pl
#   -> marketplace_readiness_test::test_lang_files_are_data_only

# --- Boilerplate and copyright -------------------------------------------------------------
MK7_copyright_dropped | classes/local/keys.php | mk7_copyright_dropped.pl
#   -> marketplace_readiness_test::test_source_files_carry_the_boilerplate
